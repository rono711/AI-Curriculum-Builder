<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
            name="viewport"
            content="width=device-width, initial-scale=1.0">

    <link
            rel="icon"
            type="image/png"
            href="/static/RS favicon.png">

    <title>

        Rono's School AI Curriculum Builder

    </title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {

            margin: 0;

            background: #f3f5f8;

            font-family: Arial, Helvetica, sans-serif;

        }

        .container {

            width: 860px;

            margin: 35px auto;

            background: #ffffff;

            border-radius: 18px;

            overflow: hidden;

            box-shadow: 0 12px 30px rgba(0, 0, 0, .15);

        }

        .header {

            text-align: center;

            padding: 35px;

            border-bottom: 8px solid #d71920;

        }

        .logo {

            width: 520px;

            max-width: 100%;

        }

        .title {

            margin-top: 20px;

            font-size: 44px;

            font-weight: bold;

            color: #d71920;

        }

        .subtitle {

            margin-top: 10px;

            font-size: 24px;

            color: #003366;

        }

        .content {

            padding: 45px;

        }

        label {

            display: block;

            margin-top: 24px;

            margin-bottom: 8px;

            font-size: 22px;

            font-weight: bold;

            color: #003366;

        }

        .required {

            color: #d71920;

        }

        input,
        select {

            width: 100%;

            padding: 14px;

            font-size: 20px;

            border-radius: 8px;

            border: 1px solid #cccccc;

        }

        input:focus,
        select:focus {

            outline: none;

            border-color: #003366;

        }

        .hidden {

            display: none;

        }

        .actions {

            display: flex;

            gap: 20px;

            margin-top: 20px;

        }

        .actions button {

            flex: 1;

            margin-top: 0;

        }

        button {

            width: 100%;

            margin-top: 35px;

            padding: 18px;

            border: none;

            border-radius: 8px;

            background: #14853b;

            color: white;

            font-size: 24px;

            font-weight: bold;

            cursor: pointer;

        }

        button:hover {

            background: #0f6b2f;

        }

        button:disabled {

            background: #999;

            cursor: not-allowed;

        }

        #lessons {

            margin-top: 15px;

            padding: 18px;

            background: #fafafa;

            border: 1px solid #dddddd;

            border-radius: 8px;

        }

        .lesson {

            margin-bottom: 15px;

            font-size: 18px;

        }

		        /* ==================================================
           Elaboration Build Status
        ================================================== */

        .lesson-published {

            padding: 14px;

            margin-bottom: 12px;

            background: #f3f5f8;

            border: 1px solid #d7dde5;

            border-left: 5px solid #14853b;

            border-radius: 8px;

        }

        .lesson-available {

            padding: 10px;

            margin-bottom: 10px;

        }

        .published-status {

            display: block;

            margin-top: 8px;

            margin-left: 28px;

            color: #14853b;

            font-size: 15px;

            font-weight: bold;

        }

        .update-elaboration {

            width: auto;

            margin-top: 10px;

            margin-left: 28px;

            padding: 8px 14px;

            background: #003366;

            color: white;

            border: none;

            border-radius: 6px;

            font-size: 14px;

            font-weight: bold;

            cursor: pointer;

        }

        .update-elaboration:hover {

            background: #002244;

        }

		        /* ======================================================
           Selective Update Modal
        ====================================================== */

        .update-modal-overlay {

            display: none;

            position: fixed;

            inset: 0;

            background: rgba(0, 0, 0, 0.55);

            z-index: 10000;

            align-items: center;

            justify-content: center;

        }

        .update-modal {

            width: 520px;

            max-width: calc(100% - 40px);

            background: white;

            border-radius: 14px;

            padding: 28px;

            box-shadow:
                0 12px 40px rgba(0, 0, 0, 0.25);

        }

        .update-modal h3 {

            margin-top: 0;

            color: #003366;

        }

        .update-modal-subtitle {

            margin-bottom: 20px;

            color: #555;

        }

        .update-option {

            display: block;

            padding: 10px 0;

            font-size: 16px;

        }

        .update-option input {

            margin-right: 10px;

        }

        .update-option-disabled {

            color: #888;

        }

        .update-modal-actions {

            display: flex;

            justify-content: flex-end;

            gap: 12px;

            margin-top: 24px;

        }

        .update-modal-actions button {

            width: auto;

            padding: 10px 18px;

        }

        .update-cancel {

            background: #777;

        }

        .update-submit {

            background: #003366;

        }

        .lesson input:disabled {

            cursor: not-allowed;

        }

        .lesson label {

            margin: 0;

            font-size: 18px;

            color: #222;

            font-weight: normal;

        }

        .footer {

            padding: 25px;

            text-align: center;

            color: #777;

            font-size: 15px;

        }

        #status {

            display: none;

            margin-top: 30px;

            padding: 20px;

            border-radius: 8px;

            background: #eef7ff;

            border-left: 6px solid #14853b;

            font-size: 18px;

        }

        .progressOverlay {

            display: none;

            position: fixed;

            left: 0;

            top: 0;

            width: 100%;

            height: 100%;

            background: rgba(0, 0, 0, .55);

            z-index: 9999;

        }

        .progressCard {

            position: absolute;

            left: 50%;

            top: 50%;

            transform: translate(-50%, -50%);

            width: 520px;

            background: white;

            border-radius: 16px;

            padding: 35px;

            text-align: center;

        }

        .progressTitle {

            font-size: 30px;

            font-weight: bold;

            color: #003366;

        }

        .progressMessage {

            margin-top: 20px;

            font-size: 20px;

            color: #444;

        }

        .progressBar {

            width: 100%;

            height: 20px;

            background: #dddddd;

            border-radius: 20px;

            margin-top: 30px;

            overflow: hidden;

        }

        .progressFill {

            width: 0%;

            height: 100%;

            background: #14853b;

            transition: width .35s ease;

        }

        .progressPercent {

            margin-top: 18px;

            font-size: 22px;

            font-weight: bold;

            color: #003366;

        }

        .success {

            color: #14853b;

        }

        .error {

            color: #d71920;

        }

    </style>

</head>

<body>

<div
        class="progressOverlay"
        id="progressOverlay">

    <div
            class="progressCard">

        <div
                class="progressTitle">

        </div>

        <div

        <div

            </div>

        <div

    </div>

</div>

<div class="container">

    <div class="header">

        <img
                src="/static/RS.png"
                class="logo">

        <div class="title">

            Rono's AI Curriculum Builder

        </div>

        <div class="subtitle">

    </div>

    <div class="content">

        <form id="buildForm">

            <label>

                <span class="required">*</span>

            <input
                    type="email"

                Learning Area

            </label>

            <select id="learning_area">

                <option>

                </option>

            </select>

            <label>

                Subject

                <span class="required">*</span>

            </label>

            <select id="subject">

                <option>

                    Select Learning Area

                </option>

            </select>

            <label>

                Year Level

                <span class="required">*</span>

            </label>

            <select id="year_level">

                <option>

                </option>

            </select>

            <label>

                <span class="required">*</span>

                Curriculum Focus

            <div class="actions">

        </form>
		<div
    id="updateModalOverlay"
    class="update-modal-overlay">

    <div class="update-modal">

        <h3 id="updateModalTitle">
            Update / Rebuild Lesson
        </h3>

        <div
            id="updateModalSubtitle"
            class="update-modal-subtitle">
        </div>

        <p>
            Select what you want to regenerate:
        </p>

        <label class="update-option">
            <input
                type="checkbox"
                class="update-component"
                value="lesson_content">

            Lesson Content / Mission
        </label>

        <label class="update-option">
            <input
                type="checkbox"
                class="update-component"
                value="slides">

            Slides / Did You Know
        </label>

        <label class="update-option">
            <input
                type="checkbox"
                class="update-component"
                value="activities">

            Activities / Let's Do It
        </label>

        <label class="update-option">
            <input
                type="checkbox"
                class="update-component"

        </label>

        <label
            class="update-option update-option-disabled">

            <input
                type="checkbox"

            — coming later

        </label>

        <hr>

        <label class="update-option">

            <input
                type="checkbox"

        </label>

        <div class="update-modal-actions">

    </div>

</div>

        <div id="status"></div>

    </div>

    <div class="footer">

        <div class="footer">

            &copy; Rono's &trade; AI Curriculum Builder 2026

        </div>

    </div>

</div>

<script>

    const API_BASE =
        "https://api.ronosschool.com";

    /* ==========================================================
       Generic Helpers
    ========================================================== */

    function clearSelect(
        id,
        placeholder
    ) {

        document.getElementById(id).innerHTML =

            `<option value="">${placeholder}</option>`;

    }

    function clearLessons() {

        document.getElementById("lessons").innerHTML =

            "<div class='lesson'>Waiting for Curriculum Topic...</div>";

    }

    function removeNan(values) {

        return values.filter(v =>

            v !== null &&

            v !== "" &&

            String(v).toLowerCase() !== "nan"
        );

    }

    async function fetchJSON(url) {

        const response = await fetch(url);

        if (!response.ok) {

            throw new Error(
                await response.text()
            );

        }

        return await response.json();

    }

    /* ==========================================================
       Learning Areas
    ========================================================== */

    async function loadLearningAreas() {

        try {

            const areas = removeNan(
                await fetchJSON(
                    API_BASE +

                    "/learning-areas"
                )
            );

            const select =

                document.getElementById(
                    "learning_area"
                );

            clearSelect(
                "learning_area",

                "Select Learning Area"
            );

            areas.forEach(area => {

                const option =

                    document.createElement("option");

                option.value = area;

                option.textContent = area;

                select.appendChild(option);

            });

        } catch (err) {

            console.error(err);

            alert(
                "Unable to load Learning Areas."
            );

        }

    }

    /* ==========================================================
       Subjects
    ========================================================== */

    async function loadSubjects() {

        clearSelect(
            "subject",

            "Loading..."
        );

        clearSelect(
            "year_level",

            "Select Subject"
        );

        clearSelect(
            "strand",

            "Select Year Level"
        );

        clearSelect(
            "sub_strand",

            "Select Strand"
        );

        clearSelect(
            "topic",

            "Select Curriculum Focus"
        );

        clearLessons();

        const learningArea =

            document.getElementById(
                "learning_area"
            ).value;

        const subjects = removeNan(
            await fetchJSON(
                API_BASE +

                "/subjects?" +

                "learning_area=" +

                encodeURIComponent(
                    learningArea
                )
            )
        );

        const select =

            document.getElementById(
                "subject"
            );

        clearSelect(
            "subject",

            "Select Subject"
        );

        subjects.forEach(subject => {

            const option =

                document.createElement("option");

            option.value = subject;

            option.textContent = subject;

            select.appendChild(option);

        });

    }

    /* ==========================================================
       Year Levels
    ========================================================== */

    async function loadYearLevels() {

        clearSelect(
            "year_level",

            "Loading..."
        );

        clearSelect(
            "strand",

            "Select Year Level"
        );

        clearSelect(
            "sub_strand",

            "Select Strand"
        );

        clearSelect(
            "topic",

            "Select Curriculum Focus"
        );

        clearLessons();

        const learningArea =

            document.getElementById(
                "learning_area"
            ).value;

        const subject =

            document.getElementById(
                "subject"
            ).value;

        const years = removeNan(
            await fetchJSON(
                API_BASE +

                "/year-levels?" +

                "learning_area=" +

                encodeURIComponent(
                    learningArea
                )

                +

                "&subject=" +

                encodeURIComponent(
                    subject
                )
            )
        );

        const select =

            document.getElementById(
                "year_level"
            );

        clearSelect(
            "year_level",

            "Select Year Level"
        );

        years.forEach(year => {

            const option =

                document.createElement("option");

            option.value = year;

            option.textContent = year;

            select.appendChild(option);

        });

    }

    /* ==========================================================
       Strands
    ========================================================== */

    async function loadStrands() {

        clearSelect(
            "strand",
            "Loading..."
        );

        clearSelect(
            "sub_strand",
            "Select Curriculum Focus"
        );

        clearSelect(
            "topic",
            "Select Curriculum Focus"
        );

        clearLessons();

        const learningArea =
            document.getElementById(
                "learning_area"
            ).value;

        const subject =
            document.getElementById(
                "subject"
            ).value;

        const yearLevel =
            document.getElementById(
                "year_level"
            ).value;

        const strands = removeNan(
            await fetchJSON(
                API_BASE +

                "/strands?" +

                "learning_area=" +

                encodeURIComponent(
                    learningArea
                )

                +

                "&subject=" +

                encodeURIComponent(
                    subject
                )

                +

                "&year_level=" +

                encodeURIComponent(
                    yearLevel
                )
            )
        );

        const select =
            document.getElementById(
                "strand"
            );

        clearSelect(
            "strand",
            "Select Strand"
        );

        strands.forEach(strand => {

            const option =
                document.createElement("option");

            option.value = strand;

            option.textContent = strand;

            select.appendChild(option);

        });

    }


    /* ==========================================================
       Curriculum Focus
       (Sub-Strand OR Content Description)
    ========================================================== */

    async function loadCurriculumFocus() {

        clearSelect(
            "sub_strand",
            "Loading..."
        );

        clearSelect(
            "topic",
            "Select Curriculum Focus"
        );

        clearLessons();

        const learningArea =
            document.getElementById(
                "learning_area"
            ).value;

        const subject =
            document.getElementById(
                "subject"
            ).value;

        const yearLevel =
            document.getElementById(
                "year_level"
            ).value;

        const strand =
            document.getElementById(
                "strand"
            ).value;

        const values = removeNan(
            await fetchJSON(
                API_BASE +

                "/sub-strands?" +

                "learning_area=" +

                encodeURIComponent(
                    learningArea
                )

                +

                "&subject=" +

                encodeURIComponent(
                    subject
                )

                +

                "&year_level=" +

                encodeURIComponent(
                    yearLevel
                )

                +

                "&strand=" +

                encodeURIComponent(
                    strand
                )
            )
        );

        const select =
            document.getElementById(
                "sub_strand"
            );

        clearSelect(
            "sub_strand",
            "Select Curriculum Focus"
        );

        values.forEach(value => {

            const option =
                document.createElement("option");

            option.value = value;

            option.textContent = value;

            select.appendChild(option);

        });

    }


    /* ==========================================================
       Curriculum Topics
       (Elaborations)
    ========================================================== */

    async function loadTopics() {

        clearSelect(
            "topic",
            "Loading..."
        );

        clearLessons();

        const learningArea =
            document.getElementById(
                "learning_area"
            ).value;

        const subject =
            document.getElementById(
                "subject"
            ).value;

        const yearLevel =
            document.getElementById(
                "year_level"
            ).value;

        const strand =
            document.getElementById(
                "strand"
            ).value;

        const curriculumFocus =
            document.getElementById(
                "sub_strand"
            ).value;

        const topics =

            await fetchJSON(
                API_BASE +

                "/topics?" +

                "learning_area=" +

                encodeURIComponent(
                    learningArea
                )

                +

                "&subject=" +

                encodeURIComponent(
                    subject
                )

                +

                "&year_level=" +

                encodeURIComponent(
                    yearLevel
                )

                +

                "&strand=" +

                encodeURIComponent(
                    strand
                )

                +

                "&sub_strand=" +

                encodeURIComponent(
                    curriculumFocus
                )
            );

        const select =
            document.getElementById(
                "topic"
            );

        clearSelect(
            "topic",
            "Select Curriculum Topic"
        );

        topics.forEach(topic => {

            const option =
                document.createElement("option");

            option.value =
                topic.parent_code;

            option.textContent =
                topic.topic;

            select.appendChild(option);

        });

    }


    /* ==========================================================
       Lessons
    ========================================================== */

    async function loadLessons() {

        const parentCode =
            document.getElementById("topic").value;

        if (!parentCode) {
            return;
        }

        const container =
            document.getElementById("lessons");

        container.innerHTML =
            "<div>Loading Lessons...</div>";

        const response = await fetch(

            API_BASE +

            "/lessons?parent_code=" +

            encodeURIComponent(parentCode)

        );

        const lessons =
            await response.json();

        container.innerHTML = "";

        lessons.forEach(lesson => {

            const div =
                document.createElement("div");

            div.className = "lesson";


            /*
             * =============================================
             * Previously Published Elaboration
             * =============================================
             */

            if (lesson.already_built) {

                div.classList.add(
                    "lesson-published"
                );

                div.innerHTML = `

<label>

<input
    type="checkbox"
    value="${lesson.lesson_number}"
    data-topic="${lesson.topic_id}"
    disabled>

<strong>
Lesson ${lesson.lesson_number}
</strong>

<br>

${lesson.lesson}

</label>

<span class="published-status">

✓ Already Published — Build ${lesson.previous_build_id}

</span>

<button
    type="button"
    class="update-elaboration"
    data-lesson-number="${lesson.lesson_number}"
    data-topic="${lesson.topic_id}"
    data-elaboration-key="${lesson.elaboration_key}"
    data-previous-build-id="${lesson.previous_build_id}"
    data-previous-package-id="${lesson.previous_lesson_package_id}">

Update / Rebuild

</button>

`;

            }


            /*
             * =============================================
             * New / Available Elaboration
             * =============================================
             */

            else {

                div.classList.add(
                    "lesson-available"
                );

                div.innerHTML = `

<label>

<input
    type="checkbox"
    value="${lesson.lesson_number}"
    data-topic="${lesson.topic_id}">

<strong>
Lesson ${lesson.lesson_number}
</strong>

<br>

${lesson.lesson}

</label>

`;

            }

            container.appendChild(div);

        });

    }
    /* ==========================================================
       Lessons
    ========================================================== */

    




    /* ==========================================================
       Select All
    ========================================================== */

    function selectAllLessons() {

        document

            .querySelectorAll(
                "#lessons input[type=checkbox]:checked:not(:disabled)"
            )

            .forEach(
                checkbox =>

                    checkbox.checked = true
            );

    }


    /* ==========================================================
       Clear All
    ========================================================== */

    function clearAllLessons() {

        document

            .querySelectorAll(
                "#lessons input[type=checkbox]"
            )

            .forEach(
                checkbox =>

                    checkbox.checked = false
            );

    }


    /* ==========================================================
       Event Wiring
    ========================================================== */

    window.addEventListener(
        "DOMContentLoaded",

        () => {

            loadLearningAreas();

        }
    );


    document

        .getElementById(
            "learning_area"
        )

        .addEventListener(
            "change",

            loadSubjects
        );


    document

        .getElementById(
            "subject"
        )

        .addEventListener(
            "change",

            loadYearLevels
        );


    document

        .getElementById(
            "year_level"
        )

        .addEventListener(
            "change",

            loadStrands
        );


    document

        .getElementById(
            "strand"
        )

        .addEventListener(
            "change",

            loadCurriculumFocus
        );


    document

        .getElementById(
            "sub_strand"
        )

        .addEventListener(
            "change",

            loadTopics
        );


    document

        .getElementById(
            "topic"
        )

        .addEventListener(
            "change",

            loadLessons
        );


    document

        .getElementById(
            "select_all"
        )

        .addEventListener(
            "click",

            selectAllLessons
        );


    document

        .getElementById(
            "clear_all"
        )

        .addEventListener(
            "click",

            clearAllLessons
        );

    /* ==========================================================
       Progress Dialog
    ========================================================== */

    function showProgress(message, percent) {

        document.getElementById(
            "progressOverlay"
        ).style.display = "block";

        document.getElementById(
            "progressMessage"
        ).textContent = message;

        document.getElementById(
            "progressFill"
        ).style.width = percent + "%";

        document.getElementById(
            "progressPercent"
        ).textContent = percent + "%";

    }


    function hideProgress() {

        document.getElementById(
            "progressOverlay"
        ).style.display = "none";

    }


    /* ==========================================================
       Status Panel
    ========================================================== */

    function showStatus(
        message,
        success = true
    ) {

        const status =

            document.getElementById(
                "status"
            );

        status.style.display = "block";

        status.className =

            success

                ? "success"

                : "error";

        status.innerHTML = message;

    }


    /* ==========================================================
       Build Request
    ========================================================== */

    async function submitBuild(event) {

        event.preventDefault();

        const checked =

            document.querySelectorAll(
                "#lessons input[type=checkbox]:not(:disabled)"
            );

        if (checked.length === 0) {

            alert(
                "Please select at least one lesson."
            );

            return;

        }

        const lessonNumbers = [];

        checked.forEach(item => {

            lessonNumbers.push(
                parseInt(
                    item.value
                )
            );

        });

        const topicId =

            checked[0].dataset.topic;

        const payload = {

            requested_by:

            document.getElementById(
                "requested_by"
            ).value,

            learning_area:

            document.getElementById(
                "learning_area"
            ).value,

            subject:

            document.getElementById(
                "subject"
            ).value,

            year_level:

            document.getElementById(
                "year_level"
            ).value,

            strand:

            document.getElementById(
                "strand"
            ).value,

            sub_strand:

            document.getElementById(
                "sub_strand"
            ).value,

            parent_code:

            document.getElementById(
                "topic"
            ).value,

            topic_id:

            topicId,

            lesson_numbers:

            lessonNumbers

        };

        const button =

            document.getElementById(
                "buildButton"
            );

        button.disabled = true;

        showProgress(
            "Creating workbook...",

            10
        );

        try {

            showProgress(
                "Preparing lesson package...",

                25
            );

            const response =

                await fetch(
                    "/api/build",

                    {

                        method: "POST",

                        headers: {

                            "Content-Type":

                                "application/json"

                        },

                        body: JSON.stringify(
                            payload
                        )

                    }
                );

            showProgress(
                "Generating AI lesson...",

                55
            );

            const result =

                await response.json();

            if (!response.ok) {

                throw new Error(
                    result.detail ||

                    JSON.stringify(result)
                );

            }

            showProgress(
                "Updating workbook...",

                85
            );

            window.buildResult = result;

            showProgress(
                "Lesson Package Complete.",

                100
            );

            await new Promise(
                resolve =>

                    setTimeout(
                        resolve,

                        700
                    )
            );

            hideProgress();

            showStatus(
                `
            <h3>✅ Lesson Package Created Successfully</h3>

            <p>

            <strong>Build Status:</strong>

            ${result.status}

            </p>

            <p>

            <strong>Lesson Package:</strong>

            ${result.lesson_package_id ?? "-"}

            </p>

            <p>

            <strong>Workbook:</strong>

            ${result.workbook_path ?? "-"}

            </p>

            <p>

            <strong>Message:</strong>

            Your lesson package has been generated successfully.

            </p>

            `,

                true
            );

        } catch (err) {

            hideProgress();

            console.error(err);

            showStatus(
                `

            <h3>❌ Build Failed</h3>

            <p>

            ${err.message}

            </p>

            `,

                false
            );

        } finally {

            button.disabled = false;

        }

    }
    /* =====================================================
       Selective Update / Rebuild Existing Elaboration
    ===================================================== */

    let selectedUpdateLesson = null;



       function closeUpdateModal(clearSelection = true) {

        const overlay =
            document.getElementById(
                "updateModalOverlay"
            );

        overlay.style.display = "none";

        if (clearSelection) {
    selectedUpdateLesson = null;
    }

        document
            .querySelectorAll(
                ".update-component"
            )
            .forEach(
                checkbox => {
                    checkbox.checked = false;
                }
            );

        document.getElementById(
            "updateSelectAll"
        ).checked = false;

    }


    document
        .getElementById("lessons")
        .addEventListener(
            "click",

            function (event) {

                const button =
                    event.target.closest(
                        ".update-elaboration"
                    );

                if (!button) {
                    return;
                }

                selectedUpdateLesson = {

                    lessonNumber:
                        parseInt(
                            button.dataset.lessonNumber
                        ),

                    topicId:
                        button.dataset.topic,

                    elaborationKey:
                        button.dataset.elaborationKey,

                    previousBuildId:
                        button.dataset.previousBuildId,

                    previousPackageId:
                        button.dataset.previousPackageId

                };

                document.getElementById(
                    "updateModalTitle"
                ).textContent =
                    "Update / Rebuild Lesson "
                    + selectedUpdateLesson.lessonNumber;

                document.getElementById(
                    "updateModalSubtitle"
                ).textContent =
                    "Previously published in Build "
                    + selectedUpdateLesson.previousBuildId
                    + ".";

                document
                    .querySelectorAll(
                        ".update-component"
                    )
                    .forEach(
                        checkbox => {
                            checkbox.checked = false;
                        }
                    );

                document.getElementById(
                    "updateSelectAll"
                ).checked = false;

                document.getElementById(
                    "updateModalOverlay"
                ).style.display = "flex";

            }
        );


    /* =====================================================
       Select All Update Components
    ===================================================== */

    document
        .getElementById(
            "updateSelectAll"
        )
        .addEventListener(
            "change",

            function () {

                const checked =
                    this.checked;

                document
                    .querySelectorAll(
                        ".update-component:not(:disabled)"
                    )
                    .forEach(
                        checkbox => {
                            checkbox.checked = checked;
                        }
                    );

            }
        );


    /* =====================================================
       Keep Select All State Synchronized
    ===================================================== */

    document
        .querySelectorAll(
            ".update-component"
        )
        .forEach(
            checkbox => {

                checkbox.addEventListener(
                    "change",

                    function () {

                        const available =
                            Array.from(
                                document.querySelectorAll(
                                    ".update-component:not(:disabled)"
                                )
                            );

                        document.getElementById(
                            "updateSelectAll"
                        ).checked =
                            available.length > 0
                            &&
                            available.every(
                                item => item.checked
                            );

                    }
                );

            }
        );


    /* =====================================================
       Cancel Selective Update
    ===================================================== */

    document
        .getElementById(
            "updateCancelButton"
        )
        .addEventListener(
            "click",
            closeUpdateModal
        );


    /* =====================================================
       Submit Selective Update
    ===================================================== */

    document
        .getElementById(
            "updateSubmitButton"
        )
        .addEventListener(
            "click",

            async function () {

                if (!selectedUpdateLesson) {

                    alert(
                        "No lesson has been selected "
                        + "for update."
                    );

                    return;
                }

                const components =
                    Array.from(
                        document.querySelectorAll(
                            ".update-component:checked"
                        )
                    ).map(
                        checkbox => checkbox.value
                    );

                if (components.length === 0) {

                    alert(
                        "Please select at least one "
                        + "component to update."
                    );

                    return;
                }

                const payload = {

                    requested_by:
                        document.getElementById(
                            "requested_by"
                        ).value,

                    learning_area:
                        document.getElementById(
                            "learning_area"
                        ).value,

                    subject:
                        document.getElementById(
                            "subject"
                        ).value,

                    year_level:
                        document.getElementById(
                            "year_level"
                        ).value,

                    strand:
                        document.getElementById(
                            "strand"
                        ).value,

                    sub_strand:
                        document.getElementById(
                            "sub_strand"
                        ).value,

                    parent_code:
                        document.getElementById(
                            "topic"
                        ).value,

                    topic_id:
                        selectedUpdateLesson.topicId,

                    lesson_numbers: [
                        selectedUpdateLesson.lessonNumber
                    ],

                    build_mode:
                        "UPDATE",

                    update_components:
                        components

                };

                const updateButton = this;

                updateButton.disabled = true;

                closeUpdateModal(false);
 
                showProgress(
                    "Preparing selected update...",
                    15
                );

                try {

                    showProgress(
                        "Generating selected components...",
                        35
                    );

                    const response =
                        await fetch(
                            "/api/build",
                            {
                                method: "POST",

                                headers: {
                                    "Content-Type":
                                        "application/json"
                                },

                                body:
                                    JSON.stringify(
                                        payload
                                    )
                            }
                        );

                    showProgress(
                        "Processing selected update...",
                        70
                    );

                    const result =
                        await response.json();

                    if (!response.ok) {

                        throw new Error(
                            result.detail
                            ||
                            JSON.stringify(
                                result
                            )
                        );

                    }

                    hideProgress();

                    showStatus(
                        `
                        <h3>
                        Selective Update Generated
                        </h3>

                        <p>
                        The selected lesson components
                        were regenerated successfully.
                        </p>

                        <p>
                        Moodle publishing is currently
                        protected while the in-place
                        updater is being completed.
                        </p>
                        `,
                        true
                    );

                }

                catch (err) {

                    hideProgress();

                    console.error(err);

                    showStatus(
                        `
                        <h3>
                        Update Generation Stopped
                        </h3>

                        <p>
                        ${err.message}
                        </p>
                        `,
                        false
                    );

                }

                finally {

                    updateButton.disabled = false;

                }

            }
        );
    
	/* ==========================================================
       Build Button
    ========================================================== */

    document

        .getElementById(
            "buildForm"
        )

        .addEventListener(
            "submit",

            submitBuild
        );


    /* ==========================================================
       Utility
    ========================================================== */

    function resetForm() {

        document

            .getElementById(
                "buildForm"
            )

            .reset();

        clearLessons();

        clearSelect(
            "subject",

            "Select Learning Area"
        );

        clearSelect(
            "year_level",

            "Select Subject"
        );

        clearSelect(
            "strand",

            "Select Year Level"
        );

        clearSelect(
            "sub_strand",

            "Select Curriculum Focus"
        );

        clearSelect(
            "topic",

            "Select Curriculum Focus"
        );

    }


    /* ==========================================================
       Application Ready
    ========================================================== */

    console.log(
        "Rono's School AI Curriculum Builder Ready"
    );

</script>
