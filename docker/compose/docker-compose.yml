services:

  curriculum-normalizer:
    image: curriculum-builder-py312-test
    container_name: curriculum-normalizer
    env_file:
      - ../../.env
    volumes:
      - /volume1/docker/curriculum-builder:/volume1/docker/curriculum-builder
    working_dir: /volume1/docker/curriculum-builder/curriculum_normalizer
    command:
      - python
      - -m
      - uvicorn
      - app:app
      - --host
      - 0.0.0.0
      - --port
      - "8001"
    ports:
      - "8001:8001"
    restart: unless-stopped


